# Tools for EVERY agent sandbox, with or without Hindsight memory:
#   - poppler-utils, so agents can render and read PDF pages
#   - WakaTime plugin for every agent present (claude / codex / pi)
#   - the Codex hooks feature flag (needed by the WakaTime Codex plugin and by
#     the Hindsight plugin)
# Used by `sb` for all sandboxes; hindsight-memory is added on top only for the
# sandboxes linked to the memory bank.
schemaVersion: "2"
kind: mixin
name: base-tools
description: Base tools for agent sandboxes (poppler-utils, WakaTime, Codex hooks flag)

permissions:
  network:
    allow:
      - registry.npmjs.org      # pi-wakatime
      - github.com              # claude/codex WakaTime marketplace clones
      - codeload.github.com
      - api.github.com          # wakatime-cli version check
      - objects.githubusercontent.com          # wakatime-cli download
      - release-assets.githubusercontent.com
      - api.wakatime.com        # WakaTime heartbeats
      - ports.ubuntu.com        # apt mirror (arm64), for poppler-utils
      - archive.ubuntu.com      # apt mirror (amd64)
      - security.ubuntu.com

setup:
  install:
    # poppler-utils (pdftoppm / pdftotext / pdfinfo) so agents can render and
    # read PDF pages. No TeX here: LaTeX is compiled on the host only.
    - user: "0"
      command: |
        set -eu
        if ! command -v pdftoppm >/dev/null; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get update || true   # a blocked third-party repo must not stop the install
          apt-get install -y --no-install-recommends poppler-utils
        fi

    # Codex hooks are behind a feature flag (WakaTime and Hindsight plugins need it)
    - user: "1000"
      command: |
        set -eu
        if command -v codex >/dev/null; then
          mkdir -p ~/.codex
          grep -q codex_hooks ~/.codex/config.toml 2>/dev/null || \
            printf '\n[features]\ncodex_hooks = true\n' >> ~/.codex/config.toml
        fi

    # WakaTime time tracking. Every install line is non-fatal.
    - user: "1000"
      command: |
        set -u
        if command -v claude >/dev/null; then
          claude plugin marketplace add https://github.com/wakatime/claude-code-wakatime.git || true
          claude plugin install claude-code-wakatime@wakatime || true
        fi
        if command -v codex >/dev/null; then
          codex plugin marketplace add wakatime/codex-cli-wakatime || true
          codex plugin add codex-cli-wakatime@wakatime || true
        fi
        # Third-party package (ttttmr/pi-wakatime)
        if command -v pi >/dev/null; then
          pi install npm:pi-wakatime || true
        fi
