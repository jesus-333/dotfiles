# tmux config that emulates the Ghostty config (ghostty/.config/ghostty/config)
#
# Mapping Ghostty -> tmux
#   Ghostty tab      -> tmux window
#   Ghostty split    -> tmux pane
#   Ghostty window   -> tmux session
#   ctrl+space>KEY   -> prefix (C-Space) + KEY
#
# Needs tmux >= 3.2. Read from ~/.config/tmux/tmux.conf (XDG path).
#
# NOTE: when tmux runs INSIDE Ghostty (also through ssh), Ghostty sees the keys
# first: C-Space, Alt+1..0 and Alt+hjkl are consumed by Ghostty and never reach
# tmux. Use this config from other terminals, or change the prefix below.

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# General

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix          # prefix twice sends C-Space to the program

set -g base-index 1               # windows start at 1, like Ghostty tabs
setw -g pane-base-index 1
set -g renumber-windows on        # no holes after closing a window

set -g mouse on
set -sg escape-time 0             # no delay after Esc (nvim)
set -g focus-events on
set -g history-limit 50000
setw -g mode-keys vi

# Colors: true color + undercurl passthrough
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Image preview in yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Reload config (ctrl+space>r = reload_config)
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# Tabs -> windows
# Ghostty has window-inherit-working-directory = false, so new windows/panes
# start in $HOME. Replace "$HOME" with "#{pane_current_path}" to inherit it.

# ctrl+space>c = new_tab
bind c new-window -c "$HOME"

# alt+1..9 = goto_tab:N
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# alt+0 = last_tab (the rightmost one, not the previously used one)
bind -n M-0 select-window -t '{end}'

# ctrl+space>k = close_window (Ghostty window = tmux session)
bind k confirm-before -p "kill session #S? (y/n)" kill-session

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# Splits -> panes

# ctrl+space>v = new_split:right, ctrl+space>h = new_split:down
bind v split-window -h -c "$HOME"
bind h split-window -v -c "$HOME"
unbind '"'
unbind %

# ctrl+space>space = equalize_splits
bind Space select-layout -E

# alt+hjkl = goto_split
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ctrl+space>a = inspector:toggle -> no equivalent, show the tmux messages log
bind a show-messages

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# Clipboard
# copy-on-select = clipboard: a mouse selection is copied as soon as the drag
# ends and stays highlighted. Copies reach the system clipboard through OSC 52
# (works locally and over ssh, if the outer terminal allows it).

set -g set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ctrl+v = paste_from_clipboard is handled by the outer terminal (bracketed
# paste), tmux does not need a binding. prefix+p pastes the last tmux buffer.
bind p paste-buffer -p

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# Theme: Catppuccin Mocha (theme = Catppuccin Mocha)
# Font, font size and vsync are terminal settings: tmux cannot change them.

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"

# Session name, turns peach while the prefix is active
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=#fab387],#[bg=#89b4fa]}#[fg=#11111b,bold]  #S #[default] "
set -g status-right "#[fg=#a6adc8] #{b:pane_current_path} #[fg=#11111b,bg=#cba6f7]  %H:%M "

setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[fg=#11111b,bg=#b4befe,bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g display-panes-active-colour "#fab387"
set -g display-panes-colour "#89b4fa"
setw -g clock-mode-colour "#89b4fa"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# CLI applications (ctrl+space>KEY = text:...)

bind z send-keys "lazygit" Enter
bind n send-keys "nvim" Enter
bind e send-keys "yazi" Enter
bind b send-keys "btop" Enter
bind l send-keys "lla" Enter
bind i send-keys "ipython" Enter "%load_ext autoreload" Enter "%autoreload 2" Enter
bind u send-keys "cd .." Enter

# Fzf
bind t send-keys "fzf-file-widget" Enter
bind f send-keys "fzf-cd-widget" Enter
